# This workflow builds the Java/Android project with Gradle using the Gradle wrapper,
# and also installs a system Gradle via gradle/actions/setup-gradle so Gradle is available.
name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      #- name: Make Gradle wrapper executable
      #  run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle*','**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Gradle (system)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5' # optional: pick a Gradle version compatible with your project

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'true'
          cmdline-tools-version: 'latest'
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            cmdline-tools;latest

      - name: Run Gradle build (desktop + android) using wrapper
        run: gradle :desktop:build :android:assembleDebug --no-daemon --info --stacktrace

      - name: Upload Android APK(s)
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/build/outputs/apk/debug/*.apk

      - name: Upload Desktop JAR(s)
        uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts
          path: desktop/build/libs/*.jar
